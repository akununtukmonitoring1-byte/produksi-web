<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pencatatan Hasil Produksi</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
      padding: 20px 12px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }
    h1, h2 { margin-top: 0; color: #111827; }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    label {
      display: block;
      margin: 10px 0 4px;
      font-size: 0.88rem;
      font-weight: 600;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font: inherit;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: 0;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      margin-top: 16px;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .error { color: #dc2626; font-size: 0.88rem; margin-top: 8px; }
    
    /* Tabel Riwayat */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 650px; font-size: 0.9rem; }
    th, td { padding: 10px; border-bottom: 1px solid #e5e7eb; text-align: left; }
    th { background: #f9fafb; }
    .img-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; }
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #10b981;
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>Input Hasil Produksi</h1>
      <form id="prod-form">
        <div class="grid-2">
          <div>
            <label for="a1">Input 1 (mis. Target)</label>
            <input type="number" id="a1" step="any" required>
          </div>
          <div>
            <label for="a2">Input 2 (mis. Total Hasil)</label>
            <input type="number" id="a2" step="any" required>
          </div>
          <div>
            <label for="a3">Input 3 (mis. Bagus/OK)</label>
            <input type="number" id="a3" step="any" required>
          </div>
          <div>
            <label for="a4">Input 4 (mis. Reject/NG)</label>
            <input type="number" id="a4" step="any" required>
          </div>
          <div>
            <label for="a5">Input 5 (mis. Downtime)</label>
            <input type="number" id="a5" step="any" required>
          </div>
          <div>
            <label for="a6">Input 6 (mis. Jam Kerja)</label>
            <input type="number" id="a6" step="any" required>
          </div>
          <div>
            <label for="a7">Input 7 (mis. Jumlah Operator)</label>
            <input type="number" id="a7" step="any" required>
          </div>
        </div>

        <label for="p-foto">Lampirkan Foto Bukti Produksi</label>
        <input type="file" id="p-foto" accept="image/*" required>

        <label for="p-ket">Keterangan / Catatan Tambahan</label>
        <textarea id="p-ket" rows="2" placeholder="Catatan shift/operator..."></textarea>

        <p id="form-msg" class="error"></p>
        <button id="save-btn" type="submit">Simpan Hasil Produksi</button>
      </form>
    </div>

    <!-- Riwayat Data -->
    <div class="card">
      <h2>Riwayat Laporan Produksi</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Waktu</th>
              <th>Foto</th>
              <th>Angka 1 - 7</th>
              <th>Keterangan</th>
            </tr>
          </thead>
          <tbody id="history-body">
            <tr><td colspan="4">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast">Berhasil disimpan!</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
